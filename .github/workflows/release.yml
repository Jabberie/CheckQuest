name: Build GitHub Release

on:
  workflow_dispatch:

  push:
    tags:
      - '*_release'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Determine version
      # -------------------------------------------------------
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME%_release}"
          else
            VERSION="development"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building CheckQuest version: ${VERSION}"

      # -------------------------------------------------------
      # Build addon folder
      # -------------------------------------------------------
      - name: Build addon folder
        shell: bash
        run: |
          mkdir -p build/CheckQuest

          cp CheckQuest.lua build/CheckQuest/
          cp CheckQuest.toc build/CheckQuest/
          cp LICENSE build/CheckQuest/
          cp CHANGES.txt build/CheckQuest/

      # -------------------------------------------------------
      # Set packaged addon version
      # -------------------------------------------------------
      - name: Set addon version
        shell: bash
        run: |
          sed -i \
            "s/@project-version@/${{ steps.version.outputs.version }}/g" \
            build/CheckQuest/CheckQuest.toc

      # -------------------------------------------------------
      # Create installable WoW addon ZIP
      #
      # CheckQuest.zip
      # └── CheckQuest/
      #     ├── CheckQuest.toc
      #     ├── CheckQuest.lua
      #     ├── LICENSE
      #     └── CHANGES.txt
      # -------------------------------------------------------
      - name: Create addon zip
        working-directory: build
        shell: bash
        run: |
          zip -r ../CheckQuest.zip CheckQuest

      # -------------------------------------------------------
      # Manual test builds
      # -------------------------------------------------------
      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: CheckQuest
          path: CheckQuest.zip
          if-no-files-found: error

      # -------------------------------------------------------
      # Tagged GitHub releases
      # -------------------------------------------------------
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: CheckQuest.zip
          generate_release_notes: true
